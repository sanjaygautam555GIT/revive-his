<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify OTP | Revive HealthScope</title><link rel="stylesheet" href="styles.css"><style>body{margin:0;background:#eef7f8;font-family:Arial,sans-serif}.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.auth-card{width:min(430px,100%);background:#fff;border:1px solid #d9e6e9;border-radius:20px;padding:32px;box-shadow:0 20px 50px rgba(10,70,80,.12)}h1{margin:0;color:#087f7a}p{color:#667085}label{display:block;margin:18px 0 7px;font-weight:700}input{width:100%;box-sizing:border-box;padding:16px;border:1px solid #cbd8dc;border-radius:10px;font-size:24px;letter-spacing:8px;text-align:center}button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:10px;background:#078d87;color:#fff;font-size:16px;font-weight:700}.link{display:block;text-align:center;margin-top:16px;color:#087f7a}.error{margin-top:14px;color:#c62828}</style></head><body><main class="auth-wrap"><section class="auth-card"><h1>Enter approval code</h1><p>A 6-digit OTP was sent to the configured owner email. It expires in 5 minutes.</p><form id="otpForm"><label>OTP</label><input id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required><button id="verifyBtn">Verify & Login</button><div id="message" class="error"></div></form><a class="link" href="login.html">Back to login</a></section></main><script src="auth.js"></script><script>if(!ReviveOtpAuth.username)location.href='login.html';document.getElementById('otpForm').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('verifyBtn'),m=document.getElementById('message');b.disabled=true;b.textContent='Verifying...';m.textContent='';try{await ReviveOtpAuth.verifyOtp(document.getElementById('otp').value);location.href='index.html'}catch(err){m.textContent=err.message;b.disabled=false;b.textContent='Verify & Login'}});</script></body></html>
