<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | Revive HealthScope</title><link rel="stylesheet" href="styles.css"><style>body{margin:0;background:#eef7f8;font-family:Arial,sans-serif}.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.auth-card{width:min(430px,100%);background:#fff;border:1px solid #d9e6e9;border-radius:20px;padding:32px;box-shadow:0 20px 50px rgba(10,70,80,.12)}h1{margin:0;color:#087f7a}p{color:#667085}label{display:block;margin:18px 0 7px;font-weight:700}input{width:100%;box-sizing:border-box;padding:14px;border:1px solid #cbd8dc;border-radius:10px;font-size:16px}button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:10px;background:#078d87;color:#fff;font-size:16px;font-weight:700}.error{margin-top:14px;color:#c62828}</style></head><body><main class="auth-wrap"><section class="auth-card"><h1>Revive HealthScope</h1><p>Secure login with email approval OTP</p><form id="loginForm"><label>Username</label><input id="username" autocomplete="username" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><button id="submitBtn">Send OTP</button><div id="message" class="error"></div></form></section></main><script src="auth.js"></script><script>document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('submitBtn'),m=document.getElementById('message');b.disabled=true;b.textContent='Sending OTP...';m.textContent='';try{await ReviveOtpAuth.requestOtp(document.getElementById('username').value,document.getElementById('password').value);location.href='otp.html'}catch(err){m.textContent=err.message;b.disabled=false;b.textContent='Send OTP'}});</script></body></html>
